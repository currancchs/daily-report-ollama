name: Offline checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/test.py
      - run: for script in scripts/*.sh; do bash -n "$script"; done
  windows-powerguard:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test shutdown safety under Windows PowerShell 5.1
        shell: powershell
        run: |
          if ($PSVersionTable.PSEdition -ne 'Desktop' -or $PSVersionTable.PSVersion.Major -ne 5 -or $PSVersionTable.PSVersion.Minor -ne 1) {
            throw 'These regression tests must run under Windows PowerShell 5.1.'
          }
          .\scripts\Test-PowerGuard.ps1 -FixtureRoot $env:RUNNER_TEMP
