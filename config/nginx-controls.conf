# Include inside the EXISTING viewer server, preserving its listen and ACL rules.
location = /controls { return 302 /controls/; }
location ^~ /controls/ {
    client_max_body_size 16k;
    # Defining headers here replaces the static server's inherited form-action
    # 'none' policy. The application supplies its own CSP with form-action 'self'.
    add_header Cache-Control "no-store, max-age=0" always;
    proxy_pass http://127.0.0.1:8767;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header X-Forwarded-Proto "";
    proxy_set_header X-Forwarded-Prefix "";
    proxy_set_header Forwarded "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 35s;
}
