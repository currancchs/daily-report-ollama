server {
    listen 127.0.0.1:8088;
    server_name _;
    root /srv/ai-monitor-report;
    access_log off;
    autoindex off;
    add_header Cache-Control "no-store, max-age=0" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    location = / { try_files /index.html =503; }
    location = /index.html { try_files $uri =503; }
    location = /report.html { try_files $uri =404; }
    location ~ "^/history/[0-9]{4}-[0-9]{2}-[0-9]{2}[.]html$" { try_files $uri =404; }
    location / { return 404; }
}
